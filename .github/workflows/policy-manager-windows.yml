name: DSH Policy Manager Windows

on:
  pull_request:
    paths:
      - 'apps/policy-manager/**'
      - '.github/workflows/policy-manager-windows.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    tags: ['dsh-policy-manager-v*']
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish from a dsh-policy-manager-v* tag using the protected release keys.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: dsh-policy-manager-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/dsh-policy-manager-v') }}

jobs:
  verify:
    name: Windows manager verification
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install manager workspace dependencies
        run: corepack pnpm install --filter @deepseek-ai/dsh-policy-manager... --frozen-lockfile
      - name: Install stable Rust target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: Run manager tests
        run: corepack pnpm --filter @deepseek-ai/dsh-policy-manager test
      - name: Run Rust manager tests
        run: cargo test --manifest-path apps/policy-manager/src-tauri/Cargo.toml --features app
      - name: Build the Windows NSIS manager package
        run: corepack pnpm --filter @deepseek-ai/dsh-policy-manager package
      - name: Packaged startup and isolated transition smoke
        shell: pwsh
        run: ./apps/policy-manager/tests/windows-manager-smoke.ps1 -ManagerExePath ./apps/policy-manager/src-tauri/target/release/dsh-policy-manager.exe
      - name: Record package hashes
        shell: pwsh
        run: |
          $packages = Get-ChildItem -LiteralPath 'apps/policy-manager/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File
          if ($packages.Count -eq 0) { throw 'Tauri did not produce a Windows NSIS installer.' }
          $packages | ForEach-Object { $artifact = $_; $hash = Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256; "$($hash.Hash.ToLower())  $($artifact.Name)" } | Set-Content -LiteralPath 'apps/policy-manager/SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-policy-manager-windows-ci
          path: |
            apps/policy-manager/src-tauri/target/release/bundle/nsis/*.exe
            apps/policy-manager/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Sign catalog and publish manager release
    needs: verify
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dsh-policy-manager-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DSH_POLICY_CATALOG_PUBLIC_KEY: ${{ vars.DSH_POLICY_CATALOG_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Require a tagged manager release and configured trust key
        shell: pwsh
        run: |
          if (-not $env:GITHUB_REF_NAME.StartsWith('dsh-policy-manager-v')) { throw 'Publish must run from a dsh-policy-manager-v* tag.' }
          $managerVersion = (Get-Content -Raw -LiteralPath 'apps/policy-manager/package.json' | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "dsh-policy-manager-v$managerVersion") { throw 'The manager release tag must match the manager package version.' }
          if ($env:DSH_POLICY_CATALOG_PUBLIC_KEY -notmatch '^[0-9a-fA-F]{64}$') { throw 'Configure the DSH_POLICY_CATALOG_PUBLIC_KEY repository variable before publishing.' }
          $catalog = Get-Content -Raw -LiteralPath 'apps/policy-manager/catalog/releases.json' | ConvertFrom-Json
          if ($catalog.desktopReleases.Count -eq 0) { throw 'The verified DSH installer catalog is empty; no public manager release can be published yet.' }
      - name: Install manager workspace dependencies
        run: corepack pnpm install --filter @deepseek-ai/dsh-policy-manager... --frozen-lockfile
      - name: Install stable Rust target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: Sign catalog with protected release key
        shell: pwsh
        env:
          DSH_POLICY_CATALOG_SIGNING_KEY: ${{ secrets.DSH_POLICY_CATALOG_SIGNING_KEY }}
        run: |
          if ($env:DSH_POLICY_CATALOG_SIGNING_KEY -notmatch '^[0-9a-fA-F]{64}$') { throw 'Configure the protected DSH_POLICY_CATALOG_SIGNING_KEY secret before publishing.' }
          node apps/policy-manager/scripts/sign-catalog.mjs apps/policy-manager/catalog/releases.json "$env:RUNNER_TEMP/manager-catalog.json.sig" --require-installable-release
          if ($LASTEXITCODE -ne 0) { throw 'The release catalog could not be signed and verified.' }
          Copy-Item -LiteralPath 'apps/policy-manager/catalog/releases.json' -Destination "$env:RUNNER_TEMP/manager-catalog.json"
      - name: Build manager with the matching catalog trust key
        run: corepack pnpm --filter @deepseek-ai/dsh-policy-manager package
      - name: Hash release assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'apps/policy-manager/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Tauri did not produce a Windows NSIS installer.' }
          $assets = @($installer.FullName, "$env:RUNNER_TEMP/manager-catalog.json", "$env:RUNNER_TEMP/manager-catalog.json.sig")
          $assets | ForEach-Object { $hash = Get-FileHash -LiteralPath $_ -Algorithm SHA256; "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($_))" } | Set-Content -LiteralPath "$env:RUNNER_TEMP/SHA256SUMS.txt" -Encoding ascii
      - name: Publish manager and catalog assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = Get-ChildItem -LiteralPath 'apps/policy-manager/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName "$env:RUNNER_TEMP/SHA256SUMS.txt" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $installer.FullName "$env:RUNNER_TEMP/SHA256SUMS.txt" --title "DSH Policy Manager $tag" --notes 'Windows x64 manager and signed catalog.' --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'The manager release assets could not be published.' }
          $catalogTag = 'dsh-policy-manager-catalog'
          gh release view $catalogTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $catalogTag "$env:RUNNER_TEMP/manager-catalog.json" "$env:RUNNER_TEMP/manager-catalog.json.sig" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $catalogTag "$env:RUNNER_TEMP/manager-catalog.json" "$env:RUNNER_TEMP/manager-catalog.json.sig" --title 'DSH Policy Manager release catalog' --notes 'Signed release catalog consumed by DSH Policy Manager.' --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'The signed catalog assets could not be published.' }
