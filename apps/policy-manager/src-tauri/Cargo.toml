[package]
name = "dsh-policy-manager"
version = "0.1.0"
description = "Standalone manager for official DSH Desktop releases and Policy mode"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
name = "dsh_policy_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dsh-policy-manager"
path = "src/main.rs"
required-features = ["app"]

[features]
default = []
app = ["dep:tauri"]

[dependencies]
ed25519-dalek = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tauri = { version = "2.12.5", optional = true, features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[dev-dependencies]
ed25519-dalek = "2.2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
