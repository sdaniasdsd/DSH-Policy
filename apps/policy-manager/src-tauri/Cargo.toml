[package]
name = "dsh-policy-manager"
version = "0.1.0"
description = "Standalone manager for official DSH Desktop releases and Policy mode"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
name = "dsh_policy_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dsh-policy-manager"
path = "src/main.rs"
required-features = ["app"]

[features]
default = []
app = ["dep:tauri"]

[dependencies]
ed25519-dalek = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2.12.5", optional = true, features = [] }
url = "2"

[dev-dependencies]
ed25519-dalek = "2.2"
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
