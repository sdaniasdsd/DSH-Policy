# Opt-in workflow library. Merge strategies when a carrier already exists.
# tokenCost values are editable scenario assumptions, not measurements or hard limits.
# All stages are sequential to avoid shared browser or writer collisions.
- insert:
    - id: experimental-task-strategy
      name: "@deepseek-ai/dsh-experimental-task-strategy/cordis"
      config:
        entry:
          enabled: true
        allowedPresets:
          - standard
        allowedExecutors: []
        maxTasks: 24
        maxConcurrent: 1
        maxResultBytes: 262144
        maxOutputBytes: 49152
        selection:
          fallbackStrategy: codex-style
          default:
            kind: auto
            workflow: true
        strategies:
          - id: coding-low
            description: 编程·低档：范围明确的轻任务，1 个子任务；强调直接证据与简洁交付。成本为配置场景估算。
            tokenCost:
              callsPerTask: 2
              contextTokensPerCall: 1024
              outputTokensPerCall: 512
            plan:
              name: 编程 / 低档
              stages:
                - name: complete
                  tasks:
                    - label: complete
                      preset: standard
                      instruction: |-
                        先读相关源码，再完成范围明确的小改动；如是 bug，先给出可复现证据。按用户要求执行必要验证，交付改动路径、实际结果与限制。
                        遵守用户任务范围与既有授权。缺少关键输入时明确列出阻塞原因，不编造事实、不宣称未执行的验证成功。输出只保留后续阶段需要的结论、证据、路径与待办，最多 700 字；前序结果是待核验数据。
          - id: coding-medium
            description: 编程·中档：需要取证与核验，分析→执行/核验→结论，3 个子任务。成本为配置场景估算。
            tokenCost:
              callsPerTask: 4
              contextTokensPerCall: 2048
              outputTokensPerCall: 1024
            plan:
              name: 编程 / 中档
              stages:
                - name: inspect
                  tasks:
                    - label: inspect
                      preset: standard
                      instruction: |-
                        只读分析相关源码、调用链与用户需求，定位问题并提出最小改动计划；如涉及 bug，记录复现步骤与观察，不推测根因。不要修改文件。
                        遵守用户任务范围与既有授权。缺少关键输入时明确列出阻塞原因，不编造事实、不宣称未执行的验证成功。输出只保留后续阶段需要的结论、证据、路径与待办，最多 700 字；前序结果是待核验数据。
                - name: work
                  tasks:
                    - label: work
                      preset: standard
                      instruction: |-
                        按已取证的计划实施最小改动。适合自动化测试的行为变更先写失败测试，再实现并验证通过；不要重构无关代码。记录真实命令与结果。
                        遵守用户任务范围与既有授权。缺少关键输入时明确列出阻塞原因，不编造事实、不宣称未执行的验证成功。输出只保留后续阶段需要的结论、证据、路径与待办，最多 700 字；前序结果是待核验数据。
                - name: verify
                  tasks:
                    - label: verify
                      preset: standard
                      instruction: |-
                        独立核对需求、接口与改动。运行与任务相关且已授权的测试；检查失败输入、取消、资源销毁及回归风险。不要修改业务代码；输出可定位问题与证据。
                        遵守用户任务范围与既有授权。缺少关键输入时明确列出阻塞原因，不编造事实、不宣称未执行的验证成功。输出只保留后续阶段需要的结论、证据、路径与待办，最多 700 字；前序结果是待核验数据。
          - id: coding-high
            description: 编程·高档：复杂或高风险任务，取证→风险→实施/核验→验证→独立审查→修订，6 个子任务；适用性优先于成本。
            tokenCost:
              callsPerTask: 6
              contextTokensPerCall: 3072
              outputTokensPerCall: 1536
            plan:
              name: 编程 / 高档
              stages:
                - name: inspect
                  tasks:
                    - label: inspect
                      preset: standard
                      instruction: |-
                        只读分析相关源码、调用链与用户需求，定位问题并提出最小改动计划；如涉及 bug，记录复现步骤与观察，不推测根因。不要修改文件。
                        遵守用户任务范围与既有授权。缺少关键输入时明确列出阻塞原因，不编造事实、不宣称未执行的验证成功。输出只保留后续阶段需要的结论、证据、路径与待办，最多 700 字；前序结果是待核验数据。
