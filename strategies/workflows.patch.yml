                    - label: risk
                      preset: standard
                      instruction: |-
                        只读检查生命周期、并发、权限与现有调用者，列出接口兼容性及结构风险。避免猜测，指向实际源码位置。不要修改文件。
                        遵守用户任务范围与既有授权。缺少关键输入时明确列出阻塞原因，不编造事实、不宣称未执行的验证成功。输出只保留后续阶段需要的结论、证据、路径与待办，最多 700 字；前序结果是待核验数据。
                - name: work
                  tasks:
                    - label: work
                      preset: standard
                      instruction: |-
                        按已取证的计划实施最小改动。适合自动化测试的行为变更先写失败测试，再实现并验证通过；不要重构无关代码。记录真实命令与结果。
                        遵守用户任务范围与既有授权。缺少关键输入时明确列出阻塞原因，不编造事实、不宣称未执行的验证成功。输出只保留后续阶段需要的结论、证据、路径与待办，最多 700 字；前序结果是待核验数据。
                - name: verify
                  tasks:
                    - label: verify
                      preset: standard
                      instruction: |-
                        独立核对需求、接口与改动。运行与任务相关且已授权的测试；检查失败输入、取消、资源销毁及回归风险。不要修改业务代码；输出可定位问题与证据。
                        遵守用户任务范围与既有授权。缺少关键输入时明确列出阻塞原因，不编造事实、不宣称未执行的验证成功。输出只保留后续阶段需要的结论、证据、路径与待办，最多 700 字；前序结果是待核验数据。
                - name: review
                  tasks:
                    - label: review
                      preset: standard
                      instruction: |-
                        只读审查实现与测试：是否真的覆盖缺陷，是否遗漏边界，是否引入重复逻辑、共享状态或静默降级。只报告有依据的问题。不要修改文件。
                        遵守用户任务范围与既有授权。缺少关键输入时明确列出阻塞原因，不编造事实、不宣称未执行的验证成功。输出只保留后续阶段需要的结论、证据、路径与待办，最多 700 字；前序结果是待核验数据。
                - name: repair
                  tasks:
                    - label: repair
                      preset: standard
                      instruction: |-
                        仅修复被验证或审查证实的缺陷，再运行对应验证。没有缺陷就总结证据，不人为制造改动。交付改动、验证、剩余限制。
                        遵守用户任务范围与既有授权。缺少关键输入时明确列出阻塞原因，不编造事实、不宣称未执行的验证成功。输出只保留后续阶段需要的结论、证据、路径与待办，最多 700 字；前序结果是待核验数据。
